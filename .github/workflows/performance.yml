name: Performance Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance-tests:
    name: performance-tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Select Xcode
        # The same toolchain as ci.yml; the project needs the iOS 26 SDK.
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve simulator destination
        id: destination
        run: echo "value=$(./scripts/select_simulator_destination.sh Emuqu Emuqu.xcodeproj)" >> "$GITHUB_OUTPUT"

      - name: Run Analysis performance tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Emuqu.xcodeproj \
            -scheme Emuqu \
            -destination "${{ steps.destination.outputs.value }}" \
            -resultBundlePath build/PerformanceTests.xcresult \
            -only-testing:EmuquTests/AnalysisPerformanceTests

      - name: Upload performance test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: performance-tests-xcresult
          path: build/PerformanceTests.xcresult
          if-no-files-found: ignore
