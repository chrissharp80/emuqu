version: 2

# Version-update PRs are OFF. Security alerts stay ON.
#
# Dependabot was opening weekly bump PRs that nobody could validate: when this
# was set, the CI that would test them was manual-only (macOS Actions minutes
# billed at 10x while the repository was private). `ci.yml` now runs on every
# pull request, but the only required check is the Linux gates job, so a bump
# PR still needs someone to read its macOS run before merging. The result was a
# permanent queue of PRs and a wall of red runs, which is noise to maintain and
# reads as an unmaintained repo. The fix is to stop generating the signal rather
# than keep explaining it.
#
# `open-pull-requests-limit: 0` disables VERSION updates only. GitHub still
# raises SECURITY updates for known advisories, which is the part actually worth
# being interrupted for, and Dependabot alerts continue regardless of this file.
#
# To do a dependency sweep deliberately: raise the limit, let it open PRs, run
# `make ci` locally against each, then set it back to 0. That sweep covers the
# GitHub Actions only; see the note on the Swift entry below.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"

  # Swift packages are pinned in the Xcode project's Package.resolved
  # (Emuqu.xcodeproj/project.xcworkspace/xcshareddata/swiftpm); there is no
  # Package.swift. Transitive pins such as Zip only move when polar-ble-sdk
  # moves. Dependabot's Swift updater reads Package.swift manifests, so this
  # entry has nothing to update and raising its limit opens no pull requests.
  # Sweep Swift packages in Xcode instead (File → Packages → Update to Latest
  # Package Versions), then run `make sbom`, bring the in-app
  # acknowledgements in line (`make sbom-guard` says where), and `make ci`.
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps"
