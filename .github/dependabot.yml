version: 2

# Version-update PRs are OFF. Security alerts stay ON.
#
# Dependabot was opening weekly bump PRs that nobody could validate: the CI that
# would test them is manual-only (macOS Actions minutes bill at 10x, so an
# automatic trigger is unaffordable — see .github/workflows/ci.yml). The result
# was a permanent queue of unmergeable PRs and a wall of red runs, which is
# noise to maintain and reads as an unmaintained repo. The fix is to stop
# generating the signal rather than keep explaining it.
#
# `open-pull-requests-limit: 0` disables VERSION updates only. GitHub still
# raises SECURITY updates for known advisories, which is the part actually worth
# being interrupted for, and Dependabot alerts continue regardless of this file.
#
# To do a dependency sweep deliberately: raise the limit, let it open PRs, run
# `make ci` locally against each, then set it back to 0.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"

  # Swift packages are pinned in the Xcode project's Package.resolved
  # (Emuqu.xcodeproj/project.xcworkspace/xcshareddata/swiftpm); there is no
  # Package.swift. Transitive pins such as Zip only move when polar-ble-sdk
  # moves.
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps"
