name: Security

# Three jobs:
#
#   • dependency-submission — sends sbom.spdx.json (generated from the Xcode
#                     project's Package.resolved, kept in step by `make
#                     sbom-check`) to GitHub's dependency graph. GitHub does not
#                     read an Xcode project's Package.resolved, and Dependabot's
#                     Swift updater needs a Package.swift this repository does
#                     not have, so without this the Swift packages get no
#                     vulnerability alerts at all. Its purls are the swift type
#                     the Advisory Database files Swift advisories under.
#   • codeql        — SAST over the Swift we write. Needs a real build, so it
#                     runs on macOS and takes as long as a normal compile.
#   • dependency-review — fails a pull request whose dependency changes bring
#                     in a known advisory or a denied licence.
#
# Continuous, as GitHub's default setup is: every pull request, every push to
# main, and weekly, so an advisory published against a pin nobody touched
# still reaches the code. The repository is public, so these minutes are free.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 06:17 UTC: new CodeQL queries and new advisories against pins
    # that did not change.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      base-ref:
        description: "Ref to compare FROM (defaults to the default branch)"
        type: string
        required: false
      head-ref:
        description: "Ref to compare TO (defaults to the dispatched commit)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    name: Submit Swift dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The dependency submission API needs write on contents.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # A pull request's snapshot is the branch's own commit, the one
          # dependency-review compares, not the merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Require the SBOM to match Package.resolved
        run: python3 scripts/generate_sbom.py --check

      - name: Submit the SBOM
        uses: advanced-security/spdx-dependency-submission-action@b009efcf8b9d562a4569d2028c276522232e631f  # v0.4.0
        with:
          filePattern: "sbom.spdx.json"
          manifestPath: "Emuqu.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          repoSha: ${{ github.event.pull_request.head.sha || github.sha }}
          repoRef: ${{ github.event.pull_request && format('refs/heads/{0}', github.head_ref) || github.ref }}

  codeql:
    name: CodeQL (Swift)
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Select Xcode
        # The same toolchain as ci.yml. The runner's default Xcode may predate
        # the iOS 26 SDK this project needs (FoundationModels).
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d  # v3.37.9
        with:
          languages: swift
          # security-and-quality adds maintainability queries on top of the
          # default security set. This repository already enforces its own
          # style budgets, so the extra queries are here for the security
          # rules they pull in, not the lint ones.
          queries: security-and-quality

      - name: Build for analysis
        # CodeQL's Swift extractor observes a real compile; autobuild guesses at
        # the scheme and has picked the wrong one on projects with a Watch
        # target. Build explicitly, and skip signing — nothing is installed.
        # The package flag is defined in scripts/lib/xcodebuild.sh.
        run: |
          xcodebuild build \
            -onlyUsePackageVersionsFromResolvedFile \
            -project Emuqu.xcodeproj \
            -scheme Emuqu \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO

      - name: Analyze
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d  # v3.37.9
        with:
          category: "/language:swift"

  dependency-review:
    name: Dependency review
    # A pull request compares its base with its head; a manual run compares
    # the two refs it is given. A push or the weekly run has nothing to compare.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: dependency-submission
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Diffs two refs' dependency snapshots, the Swift ones submitted by the
    # job above. Reads only, and posts no comment.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # The guard below resolves both refs, which a depth-1 checkout cannot.
          fetch-depth: 0

      # Without inputs, base is the default branch and head is the dispatched
      # commit. Dispatched from the default branch, those are the same commit
      # and the review compares nothing, then reports success: an empty result
      # read as a clean scan. So the run fails unless both refs resolve to
      # different commits. Pass `base-ref` (an earlier tag or SHA, say the last
      # release) so the diff covers the dependency changes since then.
      - name: Refuse an empty comparison
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_REF: ${{ inputs.base-ref || github.event.repository.default_branch }}
          HEAD_REF: ${{ inputs.head-ref || github.sha }}
        run: |
          set -euo pipefail
          resolve() {
            git rev-parse --verify --quiet "$1^{commit}" \
              || git rev-parse --verify --quiet "origin/$1^{commit}"
          }
          if ! base="$(resolve "$BASE_REF")"; then
            echo "base-ref '$BASE_REF' does not resolve to a commit." >&2
            exit 1
          fi
          if ! head="$(resolve "$HEAD_REF")"; then
            echo "head-ref '$HEAD_REF' does not resolve to a commit." >&2
            exit 1
          fi
          if [[ "$base" == "$head" ]]; then
            echo "base-ref '$BASE_REF' and head-ref '$HEAD_REF' are the same commit ($base)," >&2
            echo "so a dependency review would compare nothing and report success." >&2
            echo "Dispatch again with base-ref set to an earlier tag or SHA (say the last release)." >&2
            exit 1
          fi
          echo "Reviewing dependency changes from $base to $head."

      # The review reads GitHub's dependency graph. The only Swift manifest here
      # is the Package.resolved inside the Xcode project, and if the graph does
      # not index it, the review sees no Swift packages at all and reports
      # success, Zip included. So every package pinned there must appear in the
      # repository's dependency-graph SBOM, or the run fails instead of
      # reporting a review that left the Swift packages out.
      # The repository's SBOM is the default branch's, so this runs on a
      # manual run; a pull request's review reads the snapshots submitted for
      # its own two commits.
      - name: Require the Swift packages in the dependency graph
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sbom="$(gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom")"
          missing=()
          while IFS= read -r package; do
            grep -qiE "pkg:swift/${package//./\\.}(@|\")" <<<"$sbom" || missing+=("$package")
          done < <(python3 -c '
          import json, re, sys
          pins = json.load(open(sys.argv[1]))["pins"]
          for pin in pins:
              print(re.sub(r"^https?://|\.git$", "", pin["location"]))
          ' Emuqu.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved)
          if (( ${#missing[@]} > 0 )); then
            echo "These pinned Swift packages are not in the dependency graph:" >&2
            printf '  %s\n' "${missing[@]}" >&2
            echo "A dependency review would not compare them, so it cannot pass for them." >&2
            exit 1
          fi
          echo "Every pinned Swift package is in the dependency graph."

      # On a manual run the action cannot derive either ref from the event
      # payload (`getRefs` throws without a pull_request or push context), so
      # both are passed: the pull request's base and head, else the inputs
      # the steps above checked.
      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha || inputs.base-ref || github.event.repository.default_branch }}
          head-ref: ${{ github.event.pull_request.head.sha || inputs.head-ref || github.sha }}
          # The head's Swift snapshot is submitted moments before; wait for it
          # rather than review a commit the graph has not seen yet.
          retry-on-snapshot-warnings: true
          # Fail on high and critical. Moderate and low are surfaced in the
          # summary without blocking — this is a solo project and a blocking
          # gate nobody can override becomes a gate somebody disables.
          fail-on-severity: high
          # Not affected, with the evidence: GHSA-g454-wj9r-jpg4 (Zip <= 2.1.2
          # path traversal on unzip; no patched release exists) reaches the
          # app only through polar-ble-sdk's firmware update, which the app
          # never calls, and the app imports no Zip.
          # scripts/check_unreached_advisories.sh fails the day that changes.
          allow-ghsas: GHSA-g454-wj9r-jpg4
          # Copyleft licences would be a problem for App Store distribution.
          # Zip arrives transitively through polar-ble-sdk, so a licence
          # change upstream is a thing worth being told about.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0
