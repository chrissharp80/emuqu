name: Mutations

# The mutation harness: each mutation changes the meaning of one high-stakes
# behaviour (the score arithmetic, encryption, the medical-claim guard, the
# data purge) and requires the suite to notice. A build per mutation, so it is
# its own workflow rather than a job pull requests list as skipped: every
# TestFlight deploy runs it (testflight.yml), and it can be run by hand.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  mutations:
    name: Mutations caught
    runs-on: macos-26
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Every mutation is caught
        run: ./scripts/verify_tests_fail.sh

      - name: Write the result to the run summary
        if: always()
        run: |
          echo "- Mutations caught: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
