version: 2

# Version-update PRs are OFF. Security alerts stay ON.
#
# A version bump is only worth merging after its macOS build and tests pass,
# and weekly bump PRs become a standing queue of runs to read and rebase. So
# version updates are generated on purpose, not on a schedule.
#
# `open-pull-requests-limit: 0` disables VERSION updates only. GitHub still
# raises SECURITY updates for known advisories, which is the part actually worth
# being interrupted for, and Dependabot alerts continue regardless of this file.
#
# To do a dependency sweep deliberately: raise the limit, let it open PRs, run
# `make ci` locally against each, then set it back to 0. That sweep covers the
# GitHub Actions only. Dependabot's Swift updater reads Package.swift, which
# this repository does not have (its pins are in the Xcode project's
# Package.resolved), so there is no Swift entry. Swift advisories still raise
# alerts: security.yml submits sbom.spdx.json to the dependency graph. Sweep
# Swift packages in Xcode (File → Packages → Update to Latest Package
# Versions), then `make sbom`, bring the in-app acknowledgements in line
# (`make sbom-guard` says where), and `make ci`.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
