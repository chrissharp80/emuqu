name: Security

# The repository had good static hygiene (no
# hard-coded secrets, no ATS exceptions, SHA-pinned Actions, a log-redaction
# guard) and no scanner of any kind. Dependabot raises advisories for
# dependencies (its version-bump PRs are switched off, see dependabot.yml), but
# nothing at all looked at the app's own code for injection, path traversal,
# or unsafe deserialization.
#
# Two jobs, deliberately separate:
#
#   • codeql        — SAST over the Swift we write. Needs a real build, so it
#                     runs on macOS and takes as long as a normal compile.
#   • dependency-review — fails when the dependencies changed between two refs
#                     bring in a known advisory or a denied licence.
#
# MANUAL ONLY, same reasoning as ci.yml — CodeQL for Swift needs a real macOS
# compile, which is the single most expensive job in the repository. Run it when
# you want a security pass, not on a timer.
on:
  workflow_dispatch:
    inputs:
      base-ref:
        description: "Ref to compare FROM (defaults to the default branch)"
        type: string
        required: false
      head-ref:
        description: "Ref to compare TO (defaults to the dispatched commit)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (Swift)
    runs-on: macos-26
    # Never on a pull request: see the cost note on the triggers above.
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Select Xcode
        # The same toolchain as ci.yml. The runner's default Xcode may predate
        # the iOS 26 SDK this project needs (FoundationModels).
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d  # v3.37.9
        with:
          languages: swift
          # security-and-quality adds maintainability queries on top of the
          # default security set. This repository already enforces its own
          # style budgets, so the extra queries are here for the security
          # rules they pull in, not the lint ones.
          queries: security-and-quality

      - name: Build for analysis
        # CodeQL's Swift extractor observes a real compile; autobuild guesses at
        # the scheme and has picked the wrong one on projects with a Watch
        # target. Build explicitly, and skip signing — nothing is installed.
        run: |
          xcodebuild build \
            -project Emuqu.xcodeproj \
            -scheme Emuqu \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO

      - name: Analyze
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d  # v3.37.9
        with:
          category: "/language:swift"

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Diffs two refs. Cheap (Ubuntu, 1x). See the note on the steps below for
    # which refs a manual run compares. No pull request is ever involved, so
    # it needs no write permission and posts no comment.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # The guard below resolves both refs, which a depth-1 checkout cannot.
          fetch-depth: 0

      # Without inputs, base is the default branch and head is the dispatched
      # commit. Dispatched from the default branch, those are the same commit
      # and the review compares nothing, then reports success: an empty result
      # read as a clean scan. So the run fails unless both refs resolve to
      # different commits. Pass `base-ref` (an earlier tag or SHA, say the last
      # release) so the diff covers the dependency changes since then.
      - name: Refuse an empty comparison
        env:
          BASE_REF: ${{ inputs.base-ref || github.event.repository.default_branch }}
          HEAD_REF: ${{ inputs.head-ref || github.sha }}
        run: |
          set -euo pipefail
          resolve() {
            git rev-parse --verify --quiet "$1^{commit}" \
              || git rev-parse --verify --quiet "origin/$1^{commit}"
          }
          if ! base="$(resolve "$BASE_REF")"; then
            echo "base-ref '$BASE_REF' does not resolve to a commit." >&2
            exit 1
          fi
          if ! head="$(resolve "$HEAD_REF")"; then
            echo "head-ref '$HEAD_REF' does not resolve to a commit." >&2
            exit 1
          fi
          if [[ "$base" == "$head" ]]; then
            echo "base-ref '$BASE_REF' and head-ref '$HEAD_REF' are the same commit ($base)," >&2
            echo "so a dependency review would compare nothing and report success." >&2
            echo "Dispatch again with base-ref set to an earlier tag or SHA (say the last release)." >&2
            exit 1
          fi
          echo "Reviewing dependency changes from $base to $head."

      # This job is `workflow_dispatch`-only, and on a manual run the action
      # cannot derive either ref from the event payload: `getRefs` throws when
      # neither is supplied and neither a pull_request nor a push context
      # exists. So both refs are passed explicitly, the same two the step
      # above checked.
      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          base-ref: ${{ inputs.base-ref || github.event.repository.default_branch }}
          head-ref: ${{ inputs.head-ref || github.sha }}
          # Fail on high and critical. Moderate and low are surfaced in the
          # summary without blocking — this is a solo project and a blocking
          # gate nobody can override becomes a gate somebody disables.
          fail-on-severity: high
          # Copyleft licences would be a problem for App Store distribution.
          # Zip arrives transitively through polar-ble-sdk, so a licence
          # change upstream is a thing worth being told about.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0
