included:
  - Emuqu/Sources
  - EmuquTests
  - EmuquWatch Watch App

excluded:
  - Emuqu.xcodeproj
  - .build
  - build
  - DerivedData

opt_in_rules:
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - modifier_order
  - implicit_optional_initialization
  - sorted_imports
  - yoda_condition

disabled_rules:
  - trailing_whitespace
  # XCTestCase declares `open class func setUp()`, and an override has to keep
  # `class`, so the rule can only fire where it cannot be satisfied.
  - static_over_final_class
  # In an @ViewBuilder body `let _ = expr` produces no view; `_ = expr` is an
  # expression the builder tries to render and does not compile.
  - redundant_discardable_let

# A `String(localized:)` literal is its own translation key, and a prompt or
# tool-schema literal is sent to the model byte for byte, so neither can be
# wrapped. The warning tier and `.ci/swiftlint_warning_budget.txt` govern line
# length; the error tier only catches runaway lines.
line_length:
  warning: 300
  error: 1800
  ignores_interpolated_strings: true

function_body_length:
  warning: 100
  error: 200

function_parameter_count:
  warning: 7
  error: 10

type_body_length:
  warning: 500
  error: 1000

file_length:
  warning: 1000
  error: 2000

cyclomatic_complexity:
  warning: 15
  error: 30

large_tuple:
  warning: 3
  error: 5

identifier_name:
  min_length:
    warning: 1
    error: 1
  allowed_symbols:
    - "_"

reporter: "xcode"

# Two levels of type nesting: CodingKeys must sit inside their Codable type,
# scoped enums (`FetchProgress.Stage`) mean nothing at top level, and wire-format
# DTOs mirror the JSON they decode.
nesting:
  type_level:
    warning: 2

custom_rules:
  # Swift rejects a second result builder attribute only at compile time.
  stacked_result_builder:
    name: "Stacked result builder attribute"
    regex: '@(ViewBuilder|ToolbarContentBuilder)\s+@(ViewBuilder|ToolbarContentBuilder)'
    message: "Only one result builder attribute can be attached to a declaration."
    severity: error

  # ADR 005: a helper that needs its owner holds it strongly and is built on
  # demand; an optional back-reference is weak.
  no_unowned:
    name: "unowned reference"
    regex: '\bunowned(\((un)?safe\))?\s+[A-Za-z_]'
    excluded_match_kinds: [comment, doccomment, string]
    message: "Hold the owner strongly and build the helper on demand, or use weak for an optional back-reference."
    severity: error

  # The date of a change belongs to git; a comment says why the code is as it is.
  no_dated_comment:
    name: "Dated comment"
    regex: '\b20[0-9]{2}-[0-9]{2}-[0-9]{2}\b'
    match_kinds: [comment, doccomment]
    message: "Say why the code is the way it is; leave the date to git."
    severity: error

  # LICENSE is the only licence.
  no_license_header:
    name: "Licence text in source"
    regex: '(?i)(all rights reserved|strictly prohibited|proprietary and confidential|without prior written permission|licensed under)'
    match_kinds: [comment, doccomment]
    message: "LICENSE is the only licence; source files carry none of their own."
    severity: error

  # `Int64(x.timeIntervalSince(y) * 1000)` traps on a non-finite interval.
  # MillisecondOffset converts it safely.
  raw_date_ms_conversion:
    name: "Raw date-to-milliseconds conversion"
    regex: 'Int64\(\s*(?!Date\(\))[A-Za-z_$][\w.?\[\]$]*\s*\.timeIntervalSince\([^()]*\)\s*\*\s*1_?000'
    excluded: '.*/MillisecondOffset\.swift'
    excluded_match_kinds: [comment, doccomment, string]
    message: "Convert through MillisecondOffset; Int64(...) traps on a non-finite interval."
    severity: error
